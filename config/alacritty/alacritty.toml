# =============================================================================
# Alacritty Configuration — matches WezTerm setup
# =============================================================================
# Optimized for: tmux user on macOS (Apple Silicon)
# Stack: tmux (multiplexer), Neovim (editor), Gruvbox Dark, Nerd Fonts
# Alacritty is the "dumb terminal" — tmux handles tabs/panes/sessions
# Docs: https://alacritty.org/config-alacritty.html
# =============================================================================
#
# NOTE: Alacritty does NOT support font ligatures (single-glyph only).
# That's the only WezTerm feature we can't replicate here.

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
[general]
live_config_reload = true
import = []

# -----------------------------------------------------------------------------
# Environment
# -----------------------------------------------------------------------------
[env]
TERM = "xterm-256color"
PATH = "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# -----------------------------------------------------------------------------
# Shell
# -----------------------------------------------------------------------------
[terminal]
shell = { program = "/opt/homebrew/bin/zsh", args = ["--login"] }
osc52 = "CopyPaste"

# -----------------------------------------------------------------------------
# Window
# -----------------------------------------------------------------------------
[window]
# Start maximized (matches WezTerm gui-startup hook)
startup_mode = "Maximized"

# Padding (matches WezTerm: 12/12/8/4)
padding = { x = 12, y = 8 }
dynamic_padding = true

# macOS: hide titlebar & traffic-lights, keep resize (matches WezTerm RESIZE)
decorations = "Buttonless"
decorations_theme_variant = "Dark"

# Opacity + blur (matches WezTerm)
opacity = 0.95
blur = true

# Fullscreen option for Option-as-Alt
option_as_alt = "Both"

# -----------------------------------------------------------------------------
# Scrolling
# -----------------------------------------------------------------------------
[scrolling]
history = 10000
multiplier = 3

# -----------------------------------------------------------------------------
# Font (JetBrainsMono Nerd Font Medium 15pt)
# NOTE: Alacritty can't do ligatures. It falls back to system glyph lookup
# for Nerd Font icons automatically.
# -----------------------------------------------------------------------------
[font]
size = 15.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# Line height 1.15 emulation — JetBrainsMono cell is ~1em tall, offset adds breathing room
[font.offset]
x = 0
y = 4

[font.glyph_offset]
x = 0
y = 2

# -----------------------------------------------------------------------------
# Cursor (BlinkingBar — matches WezTerm)
# -----------------------------------------------------------------------------
[cursor]
style = { shape = "Beam", blinking = "Always" }
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true
thickness = 0.15

# -----------------------------------------------------------------------------
# Mouse
# -----------------------------------------------------------------------------
[mouse]
hide_when_typing = true

# Right-click: paste (Alacritty can't do "copy if selection" callback like WezTerm)
[[mouse.bindings]]
mouse = "Right"
action = "Paste"

# -----------------------------------------------------------------------------
# Selection
# -----------------------------------------------------------------------------
[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# -----------------------------------------------------------------------------
# Bell (off — matches WezTerm audible_bell = "Disabled")
# -----------------------------------------------------------------------------
[bell]
animation = "Linear"
duration = 0

# -----------------------------------------------------------------------------
# Colors — Gruvbox Dark Hard (exact WezTerm palette match)
# -----------------------------------------------------------------------------
[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"
dim_foreground = "#a89984"
bright_foreground = "#fbf1c7"

[colors.cursor]
text = "#1d2021"
cursor = "#ebdbb2"

[colors.vi_mode_cursor]
text = "#1d2021"
cursor = "#fe8019"

[colors.search.matches]
foreground = "#1d2021"
background = "#fabd2f"

[colors.search.focused_match]
foreground = "#1d2021"
background = "#fe8019"

[colors.footer_bar]
foreground = "#1d2021"
background = "#ebdbb2"

[colors.hints.start]
foreground = "#1d2021"
background = "#fabd2f"

[colors.hints.end]
foreground = "#1d2021"
background = "#ebdbb2"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.selection]
text = "#ebdbb2"
background = "#504945"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

# Dim colors (faded variants)
[colors.dim]
black   = "#32302f"
red     = "#9d0006"
green   = "#79740e"
yellow  = "#b57614"
blue    = "#076678"
magenta = "#8f3f71"
cyan    = "#427b58"
white   = "#928374"

# -----------------------------------------------------------------------------
# Hints — clickable URLs and quick-select patterns
# -----------------------------------------------------------------------------
[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
command = "open"
post_processing = true
persist = false
mouse = { enabled = true, mods = "Command" }
binding = { key = "U", mods = "Control|Shift" }

# -----------------------------------------------------------------------------
# Keybindings (matches WezTerm — leader stays with tmux)
# -----------------------------------------------------------------------------
[keyboard]
bindings = [
  # Fullscreen (Alt+Enter)
  { key = "Return", mods = "Alt", action = "ToggleFullscreen" },

  # Clear scrollback (Cmd+K — fixes garbled p10k after resize)
  { key = "K", mods = "Command", action = "ClearHistory" },
  { key = "K", mods = "Command", chars = "\u000c" },

  # Font size
  { key = "Equals",  mods = "Command|Shift", action = "IncreaseFontSize" },
  { key = "Plus",    mods = "Command|Shift", action = "IncreaseFontSize" },
  { key = "Minus",   mods = "Command",       action = "DecreaseFontSize" },
  { key = "Key0",    mods = "Command",       action = "ResetFontSize" },

  # Copy / paste
  { key = "C", mods = "Command", action = "Copy" },
  { key = "V", mods = "Command", action = "Paste" },

  # Search
  { key = "F", mods = "Command",       action = "SearchForward" },
  { key = "B", mods = "Command",       action = "SearchBackward" },

  # Tab/window (Cmd-N for new window)
  { key = "N", mods = "Command", action = "CreateNewWindow" },
  { key = "W", mods = "Command", action = "Quit" },

  # Scrolling (Shift+PgUp / Shift+PgDn already default; add Cmd+Up/Down)
  { key = "Up",   mods = "Command", action = "ScrollLineUp" },
  { key = "Down", mods = "Command", action = "ScrollLineDown" },

  # Reload config (live_config_reload handles this, but add shortcut)
  { key = "R", mods = "Command|Shift", action = "ResetFontSize" },

  # Option+Arrow word-jump in shell (Alacritty macOS: option_as_alt handles ESC prefix)
  { key = "Left",  mods = "Alt", chars = "\u001bb" },
  { key = "Right", mods = "Alt", chars = "\u001bf" },
]

# -----------------------------------------------------------------------------
# Debug
# -----------------------------------------------------------------------------
[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
renderer = "None"

# =============================================================================
# End of config
# =============================================================================
